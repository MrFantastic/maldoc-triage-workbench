# Maldoc Triage Workbench is an application that runs from its own folder
# (install.sh / install.bat, then start.sh / start.bat). It starts its isolated
# helper processes through run.py and finds the analysis tools relative to it,
# so it is deliberately not packaged for "pip install". This file records the
# project metadata and the settings for development tools; install the
# dependencies from the requirements*.txt files (tests check the two agree).

[project]
name = "maldoc-triage-workbench"
version = "1.4.0"  # keep in step with app/__init__.py (checked by tests/test_editions.py)
description = "A guided, safety-hardened desktop front-end for the REMnux maldoc tools"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Alexander Raymond" }]
requires-python = ">=3.9"
keywords = ["malware", "maldoc", "pdf", "office", "triage", "remnux", "oletools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Private :: Do Not Upload",
]
dependencies = [
    "PySide6>=6.6",
    "oletools>=0.60.2",
    "msoffcrypto-tool>=5.4",
]

[project.optional-dependencies]
# peepdf is not listed: setup_vendor.py --peepdf installs it without its JavaScript engine.
safety = ["defusedxml>=0.7", "pikepdf>=8"]
xlm = ["XLMMacroDeobfuscator>=0.2.7"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["vendor"]

[tool.ruff.lint]
extend-select = ["E501", "W"]

[tool.ruff.lint.per-file-ignores]
# Tests put the project root on sys.path before importing the app.
"tests/*" = ["E402"]
