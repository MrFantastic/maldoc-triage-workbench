name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.9
      - run: ruff check .

  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # Python 3.9 (end of life since October 2025) has no build for Ubuntu 26.04,
          # which ubuntu-latest became in October 2026; keep testing it on 24.04.
          - os: ubuntu-24.04
            python-version: "3.9"
          # The app is mainly used on Windows; test the oldest and newest supported there.
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # The unit tests need no GUI and no analysis tools (they use stand-ins);
      # these optional packages enable the PDF-decryption and hardened-XML tests.
      - run: python -m pip install -r requirements-safety.txt -c constraints.txt
      - run: python -m unittest discover -s tests -v

  # A real install of Didier Stevens' tools from the pinned commit: every file must match
  # app/core/vendor_pins.py, and the fail-closed paths must hold.
  vendor-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the pinned tools (verifies every hash)
        run: python setup_vendor.py
      - name: The app reports them as verified
        run: python -c "from app.core import vendor_manifest as m; s, p = m.verify('vendor'); print(s, p); assert s == 'verified'"
      - name: The pinned pdfid runs
        run: python vendor/pdfid.py --version
      - name: An unpinned ref is refused without --allow-unverified
        run: |
          set +e
          python setup_vendor.py --ref master; rc=$?
          echo "exit code $rc"; test "$rc" = 2
      - name: A changed tool is detected even after re-recording the manifest
        run: |
          echo "# changed" >> vendor/pdfid.py
          python setup_vendor.py --record
          python -c "from app.core import vendor_manifest as m; s, p = m.verify('vendor'); print(s, p); assert s == 'MODIFIED'"
