name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The unit tests need no GUI and no analysis tools (they use stand-ins);
      # these optional packages enable the PDF-decryption and hardened-XML tests.
      - run: python -m pip install -r requirements-safety.txt
      - run: python -m unittest discover -s tests -v
